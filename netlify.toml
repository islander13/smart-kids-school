# ─────────────────────────────────────────────────────────────────────────
# Netlify Configuration — Smart Kids School (VERSION PROPRE)
# ─────────────────────────────────────────────────────────────────────────
# Les redirections sont gérées par public/_redirects (un seul endroit)
# ─────────────────────────────────────────────────────────────────────────

[build]
  publish = "out"
  command = "npm run build"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Digest quotidien (relances d'abandon + purge RGPD) — voir
# netlify/functions/scheduled-digest.js pour le détail.
[functions."scheduled-digest"]
  schedule = "@daily"

# Headers de sécurité
# HSTS avec includeSubDomains + preload depuis le 20 août 2026 (HTTPS stable
# confirmé, aucun sous-domaine prévu — les deux restent réversibles par
# redéploiement). La directive preload seule ne fait quasiment rien de plus
# qu'un signal "candidat" : ce n'est QUE la soumission effective à la liste
# de préchargement des navigateurs (sur hstspreload.org, pas ici) qui est
# irréversible pendant des mois — cette soumission n'a volontairement PAS
# été faite, décision distincte laissée au propriétaire du site.
# Permissions-Policy laisse "payment" ouvert car le checkout Stripe embarqué
# (tarifs.tsx, stages.tsx, shop/product.tsx) en a besoin.
# Content-Security-Policy en mode BLOQUANT (passée de Report-Only à
# appliquée) : la version Report-Only a été testée contre la vraie prod
# (script Playwright écoutant securitypolicyviolation) sur accueil, tarifs,
# stages, premium — modal Stripe embarqué réellement ouverte à chaque fois —
# blog (liste + article), mon espace et FAQ, avec cookies acceptés
# (déclenche Plausible + consentement Meta Pixel). Un vrai oubli a été
# trouvé et corrigé (plausible.io) ; après correction, zéro violation sur
# l'ensemble de ces parcours. Seul point non testable sans compte : la
# lecture vidéo dans "Mon espace" (frame-src YouTube/Vimeo, domaines
# officiels fixes, risque faible).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), usb=(), magnetometer=(), gyroscope=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.googletagmanager.com https://connect.facebook.net https://js.stripe.com https://plausible.io; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https:; frame-src https://js.stripe.com https://hooks.stripe.com https://www.youtube-nocookie.com https://player.vimeo.com; connect-src 'self' https://api.stripe.com https://www.google-analytics.com https://analytics.google.com https://connect.facebook.net https://www.facebook.com https://plausible.io; object-src 'none'; base-uri 'self'; form-action 'self'"

# Assets Vite (JS/CSS hashés dans le nom de fichier) : cache long et immuable,
# un changement de contenu produit toujours un nouveau nom de fichier.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Vidéos : noms de fichiers non hashés, cache long mais pas immuable
# (permet de forcer un rafraîchissement en changeant le fichier si besoin).
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Ressources téléchargeables de "Mon espace" (PDF, fiches, projets Scratch) :
# même logique que /videos/*.
[[headers]]
  for = "/resources/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Images statiques à la racine de /public
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.jfif"
  [headers.values]
    Cache-Control = "public, max-age=604800"
