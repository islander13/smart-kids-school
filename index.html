<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#232999" />
    <title>Smart Kids School — École en ligne de programmation pour enfants en Suisse</title>
    <meta name="description" content="Smart Kids School (SKS) est une école en ligne de programmation, robotique et IA pour enfants dès 7 ans, en Suisse romande. Conçue par des ingénieurs EPFL & ETHZ. Cours individuels et stages vacances." />

    <!-- Open Graph -->
    <meta property="og:title" content="Smart Kids School — École en ligne de programmation pour enfants" />
    <meta property="og:description" content="Cours en ligne de programmation, robotique et IA pour enfants dès 7 ans. Suisse." />
    <meta property="og:image" content="https://smartkids-school.ch/og-image.jpg" />
    <meta property="og:url" content="https://smartkids-school.ch" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card — twitter:card était absent (og:* seules ne suffisent pas
         à garantir un rendu "grande image" sur X/Twitter). home.tsx met déjà
         twitter:title/description à jour par langue via JS ; card et image
         n'ont pas besoin de varier par page, posées ici une fois pour toutes. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Smart Kids School — École en ligne de programmation pour enfants" />
    <meta name="twitter:description" content="Cours en ligne de programmation, robotique et IA pour enfants dès 7 ans. Suisse." />
    <meta name="twitter:image" content="https://smartkids-school.ch/og-image.jpg" />

    <!-- Remix Icons — chargement non bloquant : le rendu initial ne doit pas
         attendre cette feuille de style tierce (icônes, pas de contenu critique). -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" /></noscript>

    <!-- Inter font — volontairement bloquant (contrairement à Remix Icons
         ci-dessus), avec display=optional. Le "preload + onload" utilisé pour
         Remix Icons semblait non-bloquant mais causait en réalité un CLS
         mesuré à 0,53 sur les pages très textuelles (blog) : la feuille de
         style contenant la règle @font-face n'était appliquée qu'après le
         premier rendu (déjà peint avec la police système), donc dès qu'Inter
         finissait de charger — même vite — le texte changeait brutalement de
         largeur. En laissant le navigateur découvrir cette règle AVANT le
         premier rendu, "optional" tient sa vraie promesse : soit Inter est
         prêt à temps (~100ms) et s'affiche direct sans jamais avoir montré la
         police système, soit la police système reste pour toute la page,
         sans jamais échanger après coup. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=optional" />

    <!-- ════════════════════════════════════════════════════════════════════
         GA4 (G-CJ55Z4B2Q2) et Meta Pixel (1573200597645423) ne sont PLUS
         chargés ici sans condition — ils se déclenchaient avant toute réponse
         à la bannière cookies (écart RGPD/nLPD + coût de perf inutile pour
         qui refuse). Chargés dynamiquement par CookieBanner.tsx, seulement
         après acceptation explicite ("statistiques" pour GA4, "marketing"
         pour Meta Pixel), et réappliqués au montage si un consentement a déjà
         été enregistré lors d'une visite précédente. Voir loadGA4()/
         loadMetaPixel() dans ce fichier.
         ════════════════════════════════════════════════════════════════════ -->

  </head>
  <body>
    <!-- ════════════════════════════════════════════════════════════════════
         NETLIFY FORMS DETECTION — formulaires cachés
         ════════════════════════════════════════════════════════════════════
         Ces formulaires invisibles sont scannés par Netlify lors du build pour
         activer la détection automatique. NE PAS LES SUPPRIMER.
         Honeypot field (bot-field) = anti-spam basique.
    -->

    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
    </form>

    <form name="newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="email" name="email" />
      <input type="text" name="source" />
    </form>

    <form name="plan-enrollment" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="plan" />
      <input type="text" name="planKey" />
      <input type="text" name="planPrice" />
      <input type="text" name="paymentMode" />
      <input type="text" name="parentName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="numChildren" />
      <input type="text" name="child1Name" />
      <input type="number" name="child1Age" />
      <input type="text" name="child2Name" />
      <input type="number" name="child2Age" />
      <textarea name="message"></textarea>
    </form>

    <!-- Champs alignés sur ce que stages.tsx soumet réellement (formData.append,
         voir handleStageSubmit) : la déclaration statique doit lister EXACTEMENT
         les mêmes champs, sans quoi Netlify Forms peut ne pas tous les inclure
         dans l'email de notification (schéma appris au build sur ce formulaire
         caché, pas sur le vrai formulaire React qui n'existe qu'au runtime). -->
    <form name="stage-enrollment" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="period" />
      <input type="text" name="selectedWeek" />
      <input type="text" name="parentName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="preferredSession" />
      <textarea name="message"></textarea>
      <input type="text" name="numChildren" />
      <input type="text" name="child1Name" />
      <input type="number" name="child1Age" />
      <input type="text" name="child2Name" />
      <input type="number" name="child2Age" />
      <input type="text" name="priceTotal" />
    </form>

    <form name="premium-enrollment" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="plan" />
      <input type="text" name="parentName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="childName" />
      <input type="number" name="childAge" />
      <textarea name="objectives"></textarea>
      <input type="text" name="bestTime" />
    </form>

    <!-- Cours d'essai gratuit (tarifs.tsx) : formulaire de prise de contact
         pur, sans Stripe. -->
    <form name="trial-lesson" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="parentName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="childName" />
      <input type="text" name="childAge" />
      <textarea name="message"></textarea>
    </form>

    <!-- Soumis uniquement par le webhook Stripe (netlify/functions/stripe-webhook.js),
         jamais par un visiteur : confirmation qu'un paiement a réellement abouti,
         même si le client ferme son onglet avant d'atteindre /merci. -->
    <form name="payment-confirmed" data-netlify="true" hidden>
      <input type="text" name="sessionId" />
      <input type="email" name="email" />
      <input type="text" name="amount" />
      <input type="text" name="productKey" />
      <input type="text" name="parentName" />
      <input type="tel" name="phone" />
    </form>

    <!-- Soumis uniquement par le webhook Stripe (netlify/functions/stripe-webhook.js),
         pour les commandes boutique (ebooks...) — pas encore active, voir src/pages/shop/. -->
    <form name="shop-order-confirmed" data-netlify="true" hidden>
      <input type="text" name="sessionId" />
      <input type="email" name="email" />
      <input type="text" name="amount" />
      <input type="text" name="productKey" />
    </form>

    <!-- Soumis uniquement par la fonction planifiée (netlify/functions/scheduled-digest.js),
         une fois par jour : récapitulatif des formulaires remplis sans paiement confirmé. -->
    <form name="abandoned-digest" data-netlify="true" hidden>
      <input type="text" name="count" />
      <textarea name="summary"></textarea>
    </form>

    <!-- Soumis uniquement par netlify/functions/lib/alertOnError.js, quand une
         fonction critique (stripe-webhook, create-checkout-session...) plante
         avec une erreur non gérée — voir ce fichier pour le détail. -->
    <form name="function-error-alert" data-netlify="true" hidden>
      <input type="text" name="functionName" />
      <input type="text" name="errorMessage" />
      <textarea name="context"></textarea>
      <input type="text" name="timestamp" />
    </form>

    <!-- ════════════════════════════════════════════════════════════════════ -->

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
