name: CI

# Vérification minimale mais réelle à chaque push/PR : type-check, lint,
# build et tests unitaires. Ne déploie rien (les déploiements restent
# manuels via `netlify deploy --prod`, voir README/rapport d'avancement) —
# ce workflow sert uniquement de filet de sécurité avant de mettre à jour
# main, pour ne plus dépendre uniquement d'une vérification manuelle.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      - name: Build
        run: npm run build
